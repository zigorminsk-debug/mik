name: Сборка APK

# Сборка подписанного Android-приложения из веб-курса.
#
# Ключ подписи (постоянный) хранится на GitHub и используется для всех сборок,
# поэтому обновления приложения устанавливаются поверх предыдущих версий.
# Ключ берётся ТОЛЬКО из секретов репозитория (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64 — файл mik-release.p12 в base64;
#   ANDROID_KEYSTORE_PASSWORD — пароль контейнера;
#   ANDROID_KEY_ALIAS — псевдоним ключа (mikacademy);
#   ANDROID_KEY_PASSWORD — пароль ключа (обычно совпадает с паролем контейнера).
# Если секреты не заданы, собирается только debug-APK без подписи.
# Ключ никогда не попадает в репозиторий, в артефакты и в логи.

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия приложения (например 1.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: debug + release APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Исходный код
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          {
            echo "### Android SDK"
            echo ""
            echo "SDK: \`$SDK\`"
            echo ""
            echo '```'
            ls "$SDK" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1 || true)
          [ -z "$SDKMANAGER" ] && SDKMANAGER=$(command -v sdkmanager 2>/dev/null || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          else
            echo "::warning::sdkmanager не найден — используются предустановленные пакеты"
          fi
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Проверка данных курса
        run: node scripts/validate-content.mjs

      - name: Получить постоянный ключ подписи
        id: keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/keystore
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PW:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            echo "::notice::Ключ подписи получен из секретов репозитория"
            {
              echo "### Ключ подписи"
              echo ""
              echo "Источник: секреты репозитория (Actions secrets)"
              echo ""
              echo '```'
              keytool -list -v -keystore android/keystore/mik-release.p12 \
                -alias "${KEY_ALIAS}" -storepass "${STORE_PW}" 2>/dev/null \
                | grep -E "Owner|Issuer|Valid from|SHA256|Certificate fingerprints" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/mik-release.p12
            chmod 600 android/keystore/mik-release.p12
            {
              echo "MIK_STORE_PASSWORD=${STORE_PW}"
              echo "MIK_KEY_ALIAS=${KEY_ALIAS}"
              echo "MIK_KEY_PASSWORD=${KEY_PW:-${STORE_PW}}"
            } >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Секреты подписи не заданы (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS) — release-сборка будет пропущена"
            {
              echo "### Ключ подписи"
              echo ""
              echo "❌ Секреты подписи не заданы — собран только debug APK."
              echo ""
              echo "Добавьте в репозитории четыре секрета (Settings → Secrets and variables → Actions):"
              echo ""
              echo "| Имя | Значение |"
              echo "|---|---|"
              echo "| ANDROID_KEYSTORE_BASE64 | base64 файла mik-release.p12 |"
              echo "| ANDROID_KEYSTORE_PASSWORD | пароль хранилища |"
              echo "| ANDROID_KEY_ALIAS | mikacademy |"
              echo "| ANDROID_KEY_PASSWORD | пароль ключа |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Определить версию
        id: ver
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="$(grep -oP '"version"\s*:\s*"\K[^"]+' web/manifest.webmanifest 2>/dev/null || echo 1.0.0)"
          fi
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Версия: ${VERSION_NAME}"

      - name: Debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-debug.log || {
            echo "### ❌ Сборка debug APK упала" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/gradle-debug.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              {
                echo "### ❌ Сборка debug APK упала"
                echo ""
                echo '```'
                tail -70 /tmp/gradle-debug.log
                echo '```'
              } > /tmp/report.md
              curl -sS -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
                --data "$(jq -n --rawfile body /tmp/report.md '{body: $body}')" || true
            fi
            exit 1
          }

      - name: Release APK (подписанный)
        if: steps.keystore.outputs.found == 'true'
        working-directory: android
        env:
          MIK_KEYSTORE_PATH: ${{ github.workspace }}/android/keystore/mik-release.p12
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }} \
            --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-release.log || {
            echo "### ❌ Сборка release APK упала" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/gradle-release.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              {
                echo "### ❌ Сборка release APK упала"
                echo ""
                echo '```'
                tail -70 /tmp/gradle-release.log
                echo '```'
              } > /tmp/report.md
              curl -sS -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
                --data "$(jq -n --rawfile body /tmp/report.md '{body: $body}')" || true
            fi
            exit 1
          }

      - name: Проверить подпись и собрать артефакты
        if: steps.keystore.outputs.found == 'true'
        working-directory: android
        run: |
          set -e
          APK=$(ls -1 app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "Release APK не найден"
            exit 0
          fi
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)
          {
            echo "### Подпись APK"
            echo ""
            echo '```'
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose --print-certs "$APK" | head -20
            else
              echo "apksigner не найден"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs "$APK" | head -20
          fi
          mkdir -p artifacts
          cp "$APK" "artifacts/mik-academy-${{ steps.ver.outputs.name }}.apk"
          echo "Подписанный APK готов: $APK"

      - name: Загрузить подписанный APK
        if: steps.keystore.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mik-academy-apk
          path: android/artifacts/*.apk
          if-no-files-found: warn

      - name: Проверить подпись debug APK
        # Отладочный ключ должен оставаться прежним, иначе новая сборка
        # не установится поверх предыдущей.
        run: |
          set -e
          APK=$(ls -1 android/app/build/outputs/apk/debug/*.apk | head -1)
          EXPECT=$(grep '^cert_sha256=' android/keystore/mik-debug.properties | cut -d= -f2 || true)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)
          ACTUAL=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}' | tr '[:lower:]' '[:upper:]' || true)
          EXPECT=$(echo "$EXPECT" | tr '[:lower:]' '[:upper:]')
          {
            echo ""
            echo '```'
            echo "$CERTS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "### Подпись debug APK"
            echo ""
            echo "- ожидаемый отпечаток: \`$EXPECT\`"
            echo "- фактический отпечаток: \`$ACTUAL\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXPECT" != "$ACTUAL" ]; then
            echo "::error::Отладочный ключ изменился ($ACTUAL != $EXPECT) — обновления поверх прежней сборки не установятся"
            exit 1
          fi
          echo "Отладочный ключ не изменился — обновление поверх прежней сборки возможно"

      - name: Загрузить debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mik-academy-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Выгрузить логи сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/gradle-*.log
          if-no-files-found: ignore

      - name: Опубликовать APK для скачивания
        # Готовый .apk выкладывается «как есть», без упаковки в zip:
        # файл сразу ставится на телефон, архив не нужен.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p android/artifacts
          cd android/artifacts
          # подписанный релизный APK (появится, когда в секретах есть ключ)
          APK=$(ls -1 mik-academy-*.apk 2>/dev/null | grep -v debug | head -1 || true)
          # отладочная сборка — всегда собрана
          DEBUG=$(ls -1 ../app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$DEBUG" ] && [ -z "$APK" ]; then
            echo "::error::Не найден ни один APK для публикации"
            exit 1
          fi
          # стабильное имя — по нему работает прямая ссылка
          # https://github.com/zigorminsk-debug/mik/releases/latest/download/mik-academy.apk
          [ -n "$APK" ] && cp "$APK" mik-academy.apk
          [ -n "$DEBUG" ] && cp "$DEBUG" mik-academy-debug.apk
          [ -n "$APK" ] && echo "Публикуем: $APK ($(du -h "$APK" | cut -f1))"

          NOTES="Подписанный APK курса по RouterOS. Файл обычный, без архива: скачайте и откройте его на телефоне. Установка поверх предыдущей версии не требует удаления приложения."
          [ -z "$APK" ] && NOTES="Отладочная сборка (подпись отладочным ключом, отдельный пакет com.mikacademy.app.debug) — только для проверки изменений. Релизная сборка появится после добавления ключа подписи в секреты репозитория."

          # 1. скользящий релиз «apk-latest» — всегда свежая сборка
          if gh release view apk-latest > /dev/null 2>&1; then
            [ -n "$APK" ] && gh release upload apk-latest mik-academy.apk --clobber
            [ -n "$DEBUG" ] && gh release upload apk-latest mik-academy-debug.apk --clobber
            [ -n "$APK" ] && gh release upload apk-latest "$APK" --clobber || true
            echo "Обновлён скользящий релиз apk-latest"
          else
            FILES=""
            [ -n "$APK" ] && FILES="mik-academy.apk $APK"
            [ -n "$DEBUG" ] && FILES="$FILES mik-academy-debug.apk"
            gh release create apk-latest $FILES \
              --title "MikroTik Академия — APK для установки" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
            echo "Создан скользящий релиз apk-latest"
          fi

          # 2. релиз по тегу — версионная запись (только подписанный APK)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -n "$APK" ]; then
            if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" mik-academy.apk --clobber
              gh release upload "${GITHUB_REF_NAME}" "$APK" --clobber || true
            else
              gh release create "${GITHUB_REF_NAME}" mik-academy.apk "$APK" \
                --title "MikroTik Академия ${{ steps.ver.outputs.name }}" \
                --notes "Подписанный APK курса по RouterOS. Установка поверх предыдущей версии не требует удаления приложения." \
                --target "$GITHUB_SHA"
            fi
            echo "Опубликован релиз ${GITHUB_REF_NAME}"
          fi

      - name: Отчёт об ошибке сборки
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/gradle-release.log
          [ -f "$LOG" ] || LOG=/tmp/gradle-debug.log
          {
            echo "### ❌ Сборка APK упала"
            echo ""
            echo "**Начало лога сборки**"
            echo ""
            echo '```'
            head -40 "$LOG" 2>/dev/null || echo "лог недоступен"
            echo '```'
            echo ""
            echo "**Ключевые строки ошибки**"
            echo ""
            echo '```'
            grep -nE "What went wrong|Caused by:|error:|FAILURE|Execution failed|^e: |^\* |Could not|A problem occurred" "$LOG" 2>/dev/null | head -40 || echo "не найдено"
            echo '```'
            echo ""
            echo "**Конец лога**"
            echo ""
            echo '```'
            tail -30 "$LOG" 2>/dev/null || echo "лог недоступен"
            echo '```'
          } > /tmp/report.md
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            curl -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
              --data "$(jq -n --rawfile body /tmp/report.md '{body: $body}')" || true
          fi
          cp /tmp/report.md build-log.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add build-log.txt
          git commit -m "отчёт о падении сборки" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs || true
